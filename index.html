<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nói ra chữ</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0f172a;
    --panel:#1e293b;
    --accent:#2563eb;
    --accent-hot:#dc2626;
    --text:#e2e8f0;
    --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    height:100vh;
    width:100vw;
    overflow:hidden;
    padding:16px;
    gap:12px;
    -webkit-user-select:none;
    user-select:none;
  }
  h1{
    font-size:15px;
    font-weight:600;
    margin:2px 0 0 0;
    color:var(--text);
  }
  #status{
    font-size:12px;
    color:var(--muted);
    min-height:16px;
    text-align:center;
  }
  #micBtn{
    width:76px;
    height:76px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:white;
    font-size:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 0 0 rgba(37,99,235,0.5);
    transition:background .15s, transform .1s;
    flex:none;
  }
  #micBtn:active{ transform:scale(0.96); }
  #micBtn.listening{
    background:var(--accent-hot);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(220,38,38,0.45); }
    70%{ box-shadow:0 0 0 22px rgba(220,38,38,0); }
    100%{ box-shadow:0 0 0 0 rgba(220,38,38,0); }
  }
  #transcript{
    width:100%;
    max-width:300px;
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    background:var(--panel);
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    line-height:1.45;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #transcript .interim{ color:var(--muted); }
  #actions{
    display:flex;
    gap:8px;
    flex:none;
    padding-bottom:4px;
  }
  button.secondary{
    background:var(--panel);
    color:var(--text);
    border:1px solid #334155;
    border-radius:8px;
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
  }
  button.secondary:active{ transform:scale(0.97); }
  #copyBtn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-width:84px;
    transition:background .2s, border-color .2s, color .2s;
  }
  #copyBtn .tick{
    display:none;
    width:14px;
    height:14px;
  }
  #copyBtn .tick path{
    fill:none;
    stroke:currentColor;
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:24;
    stroke-dashoffset:24;
  }
  #copyBtn.copied{
    background:#16a34a;
    border-color:#16a34a;
    color:#fff;
    animation:pop .3s ease-out;
  }
  #copyBtn.copied .tick{ display:inline-block; }
  #copyBtn.copied .tick path{ animation:draw .35s .05s ease-out forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes pop{
    0%{ transform:scale(0.92); }
    60%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }
  #unsupported{
    max-width:280px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    display:none;
  }
</style>
</head>
<body>
  <h1>🎤 Nói ra chữ</h1>
  <div id="status">Bấm nút để bắt đầu nói (tiếng Việt)</div>
  <button id="micBtn" aria-label="Bắt đầu / dừng nói">🎤</button>
  <div id="transcript"></div>
  <div id="actions">
    <button class="secondary" id="copyBtn"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg><span id="copyLabel">Copy</span></button>
    <button class="secondary" id="clearBtn">Xoá</button>
  </div>
  <div id="unsupported">
    Trình duyệt này không hỗ trợ nhận diện giọng nói (Web Speech API).
    Hãy mở trang này bằng Google Chrome hoặc Microsoft Edge.
  </div>

<script>
(function(){
  // Tự co nhỏ cửa sổ và ghim vào góc dưới-phải màn hình mỗi lần mở,
  // để không phải tự tay kéo nhỏ lại mỗi lần bấm icon.
  // Chỉ chạy khi đang mở dưới dạng app đã cài (PWA), không chạy khi mở như một tab bình thường.
  (function pinToCorner(){
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (!isStandalone) return;
    try {
      const w = 320, h = 480, margin = 16;
      const x = Math.max(0, window.screen.availWidth - w - margin);
      const y = Math.max(0, window.screen.availHeight - h - margin);
      window.resizeTo(w, h);
      window.moveTo(x, y);
    } catch (e) { /* trình duyệt chặn thì thôi, không sao */ }
  })();

  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const transcriptEl = document.getElementById('transcript');
  const copyBtn = document.getElementById('copyBtn');
  const copyLabel = document.getElementById('copyLabel');
  const clearBtn = document.getElementById('clearBtn');
  const unsupportedEl = document.getElementById('unsupported');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    micBtn.disabled = true;
    micBtn.style.opacity = 0.4;
    statusEl.textContent = '';
    unsupportedEl.style.display = 'block';
    return;
  }

  let recognition = null;
  let listening = false;
  let finalText = '';

  // Sau khi bấm dừng, chờ 3 giây (để nhận nốt phần chữ cuối) rồi tự copy.
  const AUTO_COPY_DELAY_MS = 3000;
  let autoCopyTimer = null;
  let copiedResetTimer = null;

  function cancelAutoCopy(){
    if (autoCopyTimer){ clearTimeout(autoCopyTimer); autoCopyTimer = null; }
  }

  function scheduleAutoCopy(){
    cancelAutoCopy();
    autoCopyTimer = setTimeout(function(){
      autoCopyTimer = null;
      const text = finalText.trim();
      if (!text){
        statusEl.textContent = 'Bấm nút để bắt đầu nói (tiếng Việt)';
        return;
      }
      copyToClipboard(text).then(function(ok){
        if (ok){
          showCopied();
          statusEl.textContent = 'Đã copy vào clipboard — dán bằng Ctrl+V';
        } else {
          statusEl.textContent = 'Không tự copy được — bấm nút Copy';
        }
      });
    }, AUTO_COPY_DELAY_MS);
  }

  function showCopied(){
    copyBtn.classList.remove('copied');
    void copyBtn.offsetWidth; // chạy lại animation nếu đang hiện
    copyBtn.classList.add('copied');
    copyLabel.textContent = 'Copied';
    clearTimeout(copiedResetTimer);
    copiedResetTimer = setTimeout(resetCopyBtn, 2000);
  }

  function resetCopyBtn(){
    copyBtn.classList.remove('copied');
    copyLabel.textContent = 'Copy';
  }

  function buildRecognition(){
    const r = new SpeechRecognition();
    r.lang = 'vi-VN';
    r.continuous = true;
    r.interimResults = true;

    r.onresult = function(event){
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++){
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal){
          finalText += chunk + ' ';
        } else {
          interim += chunk;
        }
      }
      render(interim);
    };

    r.onerror = function(event){
      if (event.error === 'no-speech' || event.error === 'aborted') return;
      statusEl.textContent = 'Lỗi: ' + event.error;
    };

    r.onend = function(){
      listening = false;
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤';
      if (finalText.trim().length){
        // Nếu tự kết thúc (không do bấm dừng) thì cũng hẹn giờ copy.
        if (!autoCopyTimer) scheduleAutoCopy();
        statusEl.textContent = 'Sẽ tự copy sau ' + (AUTO_COPY_DELAY_MS / 1000) + ' giây...';
      } else {
        statusEl.textContent = 'Bấm nút để bắt đầu nói (tiếng Việt)';
      }
    };

    return r;
  }

  function render(interim){
    transcriptEl.innerHTML = escapeHtml(finalText) +
      (interim ? '<span class="interim">' + escapeHtml(interim) + '</span>' : '');
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Trả về Promise<boolean>: true nếu copy thành công.
  function copyToClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text)
        .then(function(){ return true; })
        .catch(function(){ return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    return ok;
  }

  micBtn.addEventListener('click', function(){
    if (listening){
      recognition && recognition.stop();
      statusEl.textContent = 'Sẽ tự copy sau ' + (AUTO_COPY_DELAY_MS / 1000) + ' giây...';
      scheduleAutoCopy();
      return;
    }
    cancelAutoCopy();
    resetCopyBtn();
    finalText = '';
    transcriptEl.innerHTML = '';
    recognition = buildRecognition();
    try {
      recognition.start();
      listening = true;
      micBtn.classList.add('listening');
      micBtn.textContent = '⏹';
      statusEl.textContent = 'Đang nghe... bấm lần nữa để dừng';
    } catch (e){
      statusEl.textContent = 'Không mở được micro: ' + e.message;
    }
  });

  copyBtn.addEventListener('click', function(){
    const text = transcriptEl.textContent.trim();
    if (!text) return;
    cancelAutoCopy();
    copyToClipboard(text).then(function(ok){
      if (ok){
        showCopied();
        statusEl.textContent = 'Đã copy vào clipboard';
      } else {
        statusEl.textContent = 'Không copy được — hãy thử lại';
      }
    });
  });

  clearBtn.addEventListener('click', function(){
    cancelAutoCopy();
    resetCopyBtn();
    finalText = '';
    transcriptEl.innerHTML = '';
    statusEl.textContent = 'Bấm nút để bắt đầu nói (tiếng Việt)';
  });

  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
