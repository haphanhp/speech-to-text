<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nói ra chữ</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0f172a;
    --panel:#1e293b;
    --accent:#2563eb;
    --accent-hot:#dc2626;
    --text:#e2e8f0;
    --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    height:100vh;
    width:100vw;
    overflow:hidden;
    padding:16px;
    gap:12px;
    -webkit-user-select:none;
    user-select:none;
  }
  h1{
    font-size:15px;
    font-weight:600;
    margin:2px 0 0 0;
    color:var(--text);
  }
  #status{
    font-size:12px;
    color:var(--muted);
    min-height:16px;
    text-align:center;
  }
  #micBtn{
    width:76px;
    height:76px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:white;
    font-size:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 0 0 rgba(37,99,235,0.5);
    transition:background .15s, transform .1s;
    flex:none;
  }
  #micBtn:active{ transform:scale(0.96); }
  #micBtn.listening{
    background:var(--accent-hot);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(220,38,38,0.45); }
    70%{ box-shadow:0 0 0 22px rgba(220,38,38,0); }
    100%{ box-shadow:0 0 0 0 rgba(220,38,38,0); }
  }
  #transcript{
    width:100%;
    max-width:300px;
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    background:var(--panel);
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    line-height:1.45;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #transcript .interim{ color:var(--muted); }
  #actions{
    display:flex;
    gap:8px;
    flex:none;
    padding-bottom:4px;
  }
  button.secondary{
    background:var(--panel);
    color:var(--text);
    border:1px solid #334155;
    border-radius:8px;
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
  }
  button.secondary:active{ transform:scale(0.97); }
  #copyBtn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-width:84px;
    transition:background .2s, border-color .2s, color .2s;
  }
  #copyBtn .tick{
    display:none;
    width:14px;
    height:14px;
  }
  #copyBtn .tick path{
    fill:none;
    stroke:currentColor;
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:24;
    stroke-dashoffset:24;
  }
  #copyBtn.copied{
    background:#16a34a;
    border-color:#16a34a;
    color:#fff;
    animation:pop .3s ease-out;
  }
  #copyBtn.copied .tick{ display:inline-block; }
  #copyBtn.copied .tick path{ animation:draw .35s .05s ease-out forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes pop{
    0%{ transform:scale(0.92); }
    60%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }
  #unsupported{
    max-width:280px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    display:none;
  }
  #ttsBox{
    width:100%;
    max-width:300px;
    flex:none;
    background:var(--panel);
    border-radius:10px;
    padding:8px 10px 10px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  #ttsHeader{
    font-size:12px;
    font-weight:600;
    color:var(--muted);
  }
  #ttsText{
    width:100%;
    height:56px;
    resize:none;
    background:var(--bg);
    color:var(--text);
    border:1px solid #334155;
    border-radius:8px;
    padding:6px 8px;
    font-size:13px;
    font-family:inherit;
    line-height:1.4;
  }
  #ttsControls{
    display:flex;
    gap:6px;
    align-items:center;
  }
  #ttsLang{
    flex:1 1 auto;
    min-width:0;
    background:var(--bg);
    color:var(--text);
    border:1px solid #334155;
    border-radius:8px;
    padding:5px 6px;
    font-size:11px;
  }
  #ttsControls button{
    flex:none;
    padding:6px 10px;
    font-size:12px;
  }
  #ttsStatus{
    font-size:11px;
    color:var(--muted);
    min-height:14px;
  }
  #ttsBox.unsupported{ display:none; }
</style>
</head>
<body>
  <div id="ttsBox">
    <div id="ttsHeader">🔊 Đọc to văn bản</div>
    <textarea id="ttsText" placeholder="Dán hoặc gõ văn bản cần đọc..."></textarea>
    <div id="ttsControls">
      <select id="ttsLang">
        <option value="vi" selected>Tiếng Việt</option>
        <option value="en">Tiếng Anh</option>
        <option value="zh">Tiếng Trung</option>
        <option value="fr">Tiếng Pháp</option>
      </select>
      <button class="secondary" id="ttsPasteBtn">📋 Dán</button>
      <button class="secondary" id="ttsPlayBtn">▶️ Đọc</button>
      <button class="secondary" id="ttsStopBtn">⏹</button>
    </div>
    <div id="ttsStatus"></div>
  </div>
  <h1>🎤 Nói ra chữ</h1>
  <div id="status">Bấm Alt hoặc nút để bắt đầu nói (tiếng Việt)</div>
  <button id="micBtn" aria-label="Bắt đầu / dừng nói">🎤</button>
  <div id="transcript"></div>
  <div id="actions">
    <button class="secondary" id="copyBtn"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg><span id="copyLabel">Copy</span></button>
    <button class="secondary" id="clearBtn">Xoá</button>
  </div>
  <div id="unsupported">
    Trình duyệt này không hỗ trợ nhận diện giọng nói (Web Speech API).
    Hãy mở trang này bằng Google Chrome hoặc Microsoft Edge.
  </div>

<script>
(function(){
  // Tự co nhỏ cửa sổ và ghim vào góc dưới-phải màn hình mỗi lần mở,
  // để không phải tự tay kéo nhỏ lại mỗi lần bấm icon.
  // Chỉ chạy khi đang mở dưới dạng app đã cài (PWA), không chạy khi mở như một tab bình thường.
  (function pinToCorner(){
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (!isStandalone) return;
    try {
      const w = 320, h = 540, margin = 16;
      const x = Math.max(0, window.screen.availWidth - w - margin);
      const y = Math.max(0, window.screen.availHeight - h - margin);
      window.resizeTo(w, h);
      window.moveTo(x, y);
    } catch (e) { /* trình duyệt chặn thì thôi, không sao */ }
  })();

  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const transcriptEl = document.getElementById('transcript');
  const copyBtn = document.getElementById('copyBtn');
  const copyLabel = document.getElementById('copyLabel');
  const clearBtn = document.getElementById('clearBtn');
  const unsupportedEl = document.getElementById('unsupported');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    micBtn.disabled = true;
    micBtn.style.opacity = 0.4;
    statusEl.textContent = '';
    unsupportedEl.style.display = 'block';
    return;
  }

  let recognition = null;
  let listening = false;
  let stopping = false;
  let finalText = '';

  // Copy ngay khi engine báo kết thúc (onend), lúc đó phần chữ cuối đã về đủ.
  // Phòng khi onend không bắn, sau khi bấm dừng chờ tối đa 1,5 giây rồi vẫn copy.
  const MAX_WAIT_AFTER_STOP_MS = 1500;
  let autoCopyTimer = null;
  let copiedResetTimer = null;

  function cancelAutoCopy(){
    if (autoCopyTimer){ clearTimeout(autoCopyTimer); autoCopyTimer = null; }
  }

  function autoCopyNow(){
    cancelAutoCopy();
    const text = finalText.trim();
    if (!text){
      statusEl.textContent = 'Bấm nút để bắt đầu nói (tiếng Việt)';
      return;
    }
    copyToClipboard(text).then(function(ok){
      if (ok){
        showCopied();
        statusEl.textContent = 'Đã copy vào clipboard — dán bằng Ctrl+V';
      } else {
        setTitle('failed');
        statusEl.textContent = 'Không tự copy được — bấm nút Copy';
      }
    });
  }

  // Chốt an toàn: nếu onend không bắn thì vẫn tự copy sau một khoảng ngắn.
  function scheduleSafetyCopy(){
    cancelAutoCopy();
    autoCopyTimer = setTimeout(autoCopyNow, MAX_WAIT_AFTER_STOP_MS);
  }

  function showCopied(){
    copyBtn.classList.remove('copied');
    void copyBtn.offsetWidth; // chạy lại animation nếu đang hiện
    copyBtn.classList.add('copied');
    copyLabel.textContent = 'Copied';
    setTitle('copied');
    clearTimeout(copiedResetTimer);
    copiedResetTimer = setTimeout(resetCopyBtn, 2000);
  }

  function resetCopyBtn(){
    copyBtn.classList.remove('copied');
    copyLabel.textContent = 'Copy';
    if (!listening) setTitle('idle');
  }

  // Tiêu đề cửa sổ phản ánh trạng thái để script AutoHotkey biết khi nào xong việc.
  const TITLES = {
    idle: 'Nói ra chữ',
    listening: '● Đang nghe — Nói ra chữ',
    copying: '… Đang copy — Nói ra chữ',
    copied: '✓ Đã copy — Nói ra chữ',
    failed: '⚠ Chưa copy — Nói ra chữ'
  };
  function setTitle(state){ document.title = TITLES[state]; }

  function buildRecognition(){
    const r = new SpeechRecognition();
    r.lang = 'vi-VN';
    r.continuous = true;
    r.interimResults = true;

    r.onresult = function(event){
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++){
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal){
          finalText += chunk + ' ';
        } else {
          interim += chunk;
        }
      }
      render(interim);
    };

    r.onerror = function(event){
      if (event.error === 'no-speech' || event.error === 'aborted') return;
      statusEl.textContent = 'Lỗi: ' + event.error;
    };

    r.onend = function(){
      listening = false;
      stopping = false;
      setTitle(finalText.trim() ? 'copying' : 'idle');
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤';
      autoCopyNow();
    };

    return r;
  }

  function render(interim){
    transcriptEl.innerHTML = escapeHtml(finalText) +
      (interim ? '<span class="interim">' + escapeHtml(interim) + '</span>' : '');
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Trả về Promise<boolean>: true nếu copy thành công.
  function copyToClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text)
        .then(function(){ return true; })
        .catch(function(){ return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    return ok;
  }

  function startListening(){
    if (listening) return;
    stopping = false;
    cancelAutoCopy();
    resetCopyBtn();
    finalText = '';
    transcriptEl.innerHTML = '';
    recognition = buildRecognition();
    try {
      recognition.start();
      listening = true;
      micBtn.classList.add('listening');
      micBtn.textContent = '⏹';
      setTitle('listening');
      statusEl.textContent = 'Đang nghe... bấm Alt hoặc nút để dừng';
    } catch (e){
      statusEl.textContent = 'Không mở được micro: ' + e.message;
    }
  }

  function stopListening(){
    if (!listening || stopping) return;
    stopping = true;
    recognition && recognition.stop();
    statusEl.textContent = 'Đang chốt chữ cuối...';
    scheduleSafetyCopy();
  }

  micBtn.addEventListener('click', function(){
    if (listening) stopListening(); else startListening();
  });

  // Phím tắt (khi cửa sổ app đang được focus): bấm-thả Alt một mình = bật/tắt nói.
  // Script AutoHotkey chỉ cần đưa cửa sổ này lên trước (Ctrl+Alt+Z), còn lại bấm Alt ở đây.
  // Đổi từ Space sang Alt ngày 31/10/2026 để Space gõ được dấu cách bình thường trong ô
  // "Đọc to văn bản" (trước đó Space bị bắt toàn cục nên không gõ cách được trong ô đó).
  // Chỉ tính là "bấm Alt một mình" khi không có phím nào khác được bấm trong lúc giữ Alt —
  // nhờ vậy Alt+Tab, Alt+F4... vẫn hoạt động bình thường, không bị hiểu nhầm thành bật/tắt nói.
  let altHeld = false;
  let altChordUsed = false;
  document.addEventListener('keydown', function(e){
    if (e.key === 'Alt') {
      if (!altHeld) { altHeld = true; altChordUsed = false; }
      return;
    }
    if (altHeld) altChordUsed = true;
  });
  document.addEventListener('keyup', function(e){
    if (e.key !== 'Alt') return;
    altHeld = false;
    if (!altChordUsed) {
      if (listening) stopListening(); else startListening();
    }
    altChordUsed = false;
  });

  copyBtn.addEventListener('click', function(){
    const text = transcriptEl.textContent.trim();
    if (!text) return;
    cancelAutoCopy();
    copyToClipboard(text).then(function(ok){
      if (ok){
        showCopied();
        statusEl.textContent = 'Đã copy vào clipboard';
      } else {
        statusEl.textContent = 'Không copy được — hãy thử lại';
      }
    });
  });

  clearBtn.addEventListener('click', function(){
    cancelAutoCopy();
    resetCopyBtn();
    finalText = '';
    transcriptEl.innerHTML = '';
    statusEl.textContent = 'Bấm nút để bắt đầu nói (tiếng Việt)';
  });

  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();

// ===== Đọc to văn bản (Text-to-Speech) =====
// Ưu tiên giọng cài sẵn trên máy (Web Speech API, miễn phí, offline, không giới hạn).
// Nếu máy chưa cài giọng cho ngôn ngữ đã chọn (vd chưa cài gói tiếng Trung/Pháp trong Windows),
// tự động rớt sang Google Translate TTS (online, không cần API key) để vẫn đọc được —
// giống mô hình "nguồn chính + dự phòng" đang dùng cho phần dịch (Google + MyMemory).
(function(){
  const ttsBox = document.getElementById('ttsBox');
  const ttsText = document.getElementById('ttsText');
  const ttsLangSel = document.getElementById('ttsLang');
  const ttsPasteBtn = document.getElementById('ttsPasteBtn');
  const ttsPlayBtn = document.getElementById('ttsPlayBtn');
  const ttsStopBtn = document.getElementById('ttsStopBtn');
  const ttsStatus = document.getElementById('ttsStatus');

  const hasLocalTts = 'speechSynthesis' in window;
  if (!hasLocalTts) {
    // Vẫn cho dùng Google TTS dự phòng dù trình duyệt không có Web Speech API,
    // nên không ẩn cả khối — chỉ bỏ qua phần giọng máy.
  }

  // Mã BCP-47 để chọn giọng máy, và mã ngôn ngữ riêng cho Google Translate TTS (tl=).
  const LANGS = {
    vi: { label: 'Tiếng Việt', voicePrefix: 'vi', ttsCode: 'vi' },
    en: { label: 'Tiếng Anh', voicePrefix: 'en', ttsCode: 'en' },
    zh: { label: 'Tiếng Trung', voicePrefix: 'zh', ttsCode: 'zh-CN' },
    fr: { label: 'Tiếng Pháp', voicePrefix: 'fr', ttsCode: 'fr' }
  };

  let voices = [];
  function loadVoices(){
    if (!hasLocalTts) return;
    voices = speechSynthesis.getVoices();
  }
  loadVoices();
  if (hasLocalTts && 'onvoiceschanged' in speechSynthesis) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function findLocalVoice(prefix){
    return voices.find(function(v){ return v.lang.toLowerCase().startsWith(prefix); }) || null;
  }

  ttsPasteBtn.addEventListener('click', async function(){
    try {
      ttsText.value = await navigator.clipboard.readText();
      ttsText.focus();
    } catch (e) {
      // Trình duyệt chặn đọc clipboard tự động (thiếu quyền/không phải HTTPS) — dán tay Ctrl+V.
      ttsText.focus();
    }
  });

  let audioEl = null;
  let audioQueue = [];
  let stopped = false;

  function stopAll(){
    stopped = true;
    if (hasLocalTts) speechSynthesis.cancel();
    if (audioEl) { audioEl.pause(); audioEl.src = ''; audioEl = null; }
    audioQueue = [];
  }

  ttsStopBtn.addEventListener('click', function(){
    stopAll();
    ttsStatus.textContent = '';
  });

  // Chia nhỏ text theo khoảng trắng (không vỡ từ) vì Google Translate TTS chỉ nhận
  // mỗi lần gọi một đoạn ngắn (~200 ký tự) — văn bản dài phải đọc nối tiếp nhiều đoạn.
  function splitChunks(text, maxLen){
    const words = text.split(/\s+/).filter(Boolean);
    const chunks = [];
    let cur = '';
    for (const w of words) {
      const next = cur ? cur + ' ' + w : w;
      if (next.length > maxLen && cur) {
        chunks.push(cur);
        cur = w;
      } else {
        cur = next;
      }
    }
    if (cur) chunks.push(cur);
    return chunks;
  }

  function playGoogleTtsChunk(ttsCode){
    if (stopped || !audioQueue.length) {
      if (!stopped) ttsStatus.textContent = '';
      return;
    }
    const chunk = audioQueue.shift();
    const url = 'https://translate.google.com/translate_tts?ie=UTF-8&tl='
      + encodeURIComponent(ttsCode) + '&client=tw-ob&q=' + encodeURIComponent(chunk);
    audioEl = new Audio(url);
    audioEl.onended = function(){ playGoogleTtsChunk(ttsCode); };
    audioEl.onerror = function(){
      ttsStatus.textContent = '⚠ Google TTS lỗi (có thể đang quá giới hạn) — thử lại sau.';
    };
    audioEl.play().catch(function(){
      ttsStatus.textContent = '⚠ Trình duyệt chặn tự phát âm thanh — bấm Đọc lại lần nữa.';
    });
  }

  ttsPlayBtn.addEventListener('click', function(){
    const text = ttsText.value.trim();
    if (!text) return;
    stopAll();
    stopped = false;

    const lang = LANGS[ttsLangSel.value];
    const localVoice = hasLocalTts ? findLocalVoice(lang.voicePrefix) : null;

    if (localVoice) {
      ttsStatus.textContent = '🔊 Giọng máy: ' + localVoice.name;
      const utter = new SpeechSynthesisUtterance(text);
      utter.voice = localVoice;
      utter.lang = localVoice.lang;
      utter.onend = function(){ if (!stopped) ttsStatus.textContent = ''; };
      speechSynthesis.speak(utter);
    } else {
      ttsStatus.textContent = '🌐 Máy chưa có giọng ' + lang.label + ' — đọc qua Google TTS online...';
      audioQueue = splitChunks(text, 180);
      playGoogleTtsChunk(lang.ttsCode);
    }
  });
})();
</script>
</body>
</html>
